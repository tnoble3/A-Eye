<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: linear-gradient(160deg, #f4efe7 0%, #d8e6df 100%);
        --panel: rgba(255, 255, 255, 0.86);
        --ink: #17322d;
        --muted: #4f6862;
        --accent: #2d6653;
        --border: rgba(23, 50, 45, 0.14);
        --danger: #8a3f34;
      }

      body {
        margin: 0;
        width: 320px;
        min-height: 300px;
        font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      .shell {
        padding: 16px;
      }

      .panel {
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 18px 36px rgba(23, 50, 45, 0.12);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .big {
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
        margin: 0 0 8px;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .meta {
        display: inline-block;
        margin-top: 10px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(45, 102, 83, 0.12);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .signals {
        margin-top: 14px;
      }

      .sig {
        margin-top: 8px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
      }

      .sig-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <div class="eyebrow">A-Eye</div>
        <div id="content" class="muted">
          Right-click an image and choose "Check image authenticity" to run the
          backend analysis pipeline.
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
